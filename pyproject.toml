[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kilasifen"
description = "API fiscal headless y motor Python para integrar SIFEN Paraguay"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "The KilaSifen Authors" },
]
keywords = [
    "sifen", "factura-electronica", "paraguay", "ekuatia",
    "xml", "xsdata", "documento-electronico", "set",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "xsdata",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ras272/kilasifen"
Source = "https://github.com/ras272/kilasifen"

[project.optional-dependencies]
sign = [
    "signxml>=5.1",
    "cryptography",
    "lxml",
]
soap = ["xsdata[soap]"]
transmision = [
    "xsdata[soap]",
    "signxml>=5.1",
    "cryptography",
    "requests",
    "lxml",
]
platform = [
    "alembic>=1.14,<2",
    "fakeredis>=2,<3",
    "fastapi>=0.115,<1",
    "fpdf2>=2.7,<3",
    "jinja2>=3,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "psycopg[binary]>=3,<4",
    "python-multipart>=0.0.9,<1",
    "qrcode[pil]>=7.4,<9",
    "rq>=1.16,<2",
    "sentry-sdk>=2,<3",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.30,<1",
]
test = [
    "alembic>=1.14,<2",
    "fakeredis>=2,<3",
    "fastapi>=0.115,<1",
    "fpdf2>=2.7,<3",
    "httpx>=0.28,<1",
    "jinja2>=3,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "psycopg[binary]>=3,<4",
    "python-multipart>=0.0.9,<1",
    "pytest",
    "pytest-cov",
    "mypy==1.17.1",
    "qrcode[pil]>=7.4,<9",
    "rq>=1.16,<2",
    "ruff==0.15.12",
    "sentry-sdk>=2,<3",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.30,<1",
    "xmldiff",
    "lxml",
]

[tool.setuptools]
include-package-data = true
[tool.setuptools.packages.find]
include = ["kilasifen*"]

[tool.setuptools.dynamic]
version = {attr = "kilasifen.__version__"}

[tool.setuptools.package-data]
"kilasifen.engine" = ["de/schemas/**/*.xsd", "de/samples/**/*.xml"]
"kilasifen" = ["admin/templates/**/*.html"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"kilasifen/engine/de/bindings/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_postgres: marks tests that require a PostgreSQL backend",
]
