services:
  postgres:
    image: postgres:16.9
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kila-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    # Append-only file so queued RQ jobs, leases and the outbox heartbeat
    # survive a container restart. Fsync every second is enough for local dev.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - kila-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: kilasifen:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KILA_SIFEN_DATABASE_URL: ${KILA_SIFEN_DATABASE_URL:?Set KILA_SIFEN_DATABASE_URL in .env}
      KILA_SIFEN_REDIS_URL: ${KILA_SIFEN_REDIS_URL:?Set KILA_SIFEN_REDIS_URL in .env}
      KILA_SIFEN_API_KEYS: ${KILA_SIFEN_API_KEYS:?Set KILA_SIFEN_API_KEYS in .env}
      KILA_SIFEN_ENCRYPTION_KEY: ${KILA_SIFEN_ENCRYPTION_KEY:?Set KILA_SIFEN_ENCRYPTION_KEY in .env}
      KILA_SIFEN_ENVIRONMENT: ${KILA_SIFEN_ENVIRONMENT:-development}
      KILA_SIFEN_SIFEN_ENVIRONMENT: ${KILA_SIFEN_SIFEN_ENVIRONMENT:?Set KILA_SIFEN_SIFEN_ENVIRONMENT in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn kilasifen.api.app:create_app --factory --host 0.0.0.0 --port 8000
    # Keeps the image HEALTHCHECK (GET /v1/health on $PORT, 8000 by default).
    ports:
      - "127.0.0.1:8000:8000"
    stop_grace_period: 30s

  worker:
    image: kilasifen:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KILA_SIFEN_DATABASE_URL: ${KILA_SIFEN_DATABASE_URL:?Set KILA_SIFEN_DATABASE_URL in .env}
      KILA_SIFEN_REDIS_URL: ${KILA_SIFEN_REDIS_URL:?Set KILA_SIFEN_REDIS_URL in .env}
      KILA_SIFEN_ENCRYPTION_KEY: ${KILA_SIFEN_ENCRYPTION_KEY:?Set KILA_SIFEN_ENCRYPTION_KEY in .env}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: rq worker documents events webhooks -w kilasifen.infrastructure.jobs.worker_classes.PreloadedWorker -u ${KILA_SIFEN_REDIS_URL}
    healthcheck:
      # The image HEALTHCHECK probes HTTP /v1/health; this process serves no HTTP.
      disable: true
    stop_grace_period: 60s

  outbox:
    image: kilasifen:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KILA_SIFEN_DATABASE_URL: ${KILA_SIFEN_DATABASE_URL:?Set KILA_SIFEN_DATABASE_URL in .env}
      KILA_SIFEN_REDIS_URL: ${KILA_SIFEN_REDIS_URL:?Set KILA_SIFEN_REDIS_URL in .env}
      KILA_SIFEN_ENCRYPTION_KEY: ${KILA_SIFEN_ENCRYPTION_KEY:?Set KILA_SIFEN_ENCRYPTION_KEY in .env}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m kilasifen.infrastructure.jobs.outbox_worker
    healthcheck:
      # The image HEALTHCHECK probes HTTP /v1/health; this process serves no HTTP.
      disable: true
    stop_grace_period: 30s

  migrate:
    image: kilasifen:local
    restart: "no"
    env_file:
      - .env
    environment:
      KILA_SIFEN_DATABASE_URL: ${KILA_SIFEN_DATABASE_URL:?Set KILA_SIFEN_DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    healthcheck:
      # The image HEALTHCHECK probes HTTP /v1/health; this process serves no HTTP.
      disable: true

volumes:
  kila-postgres-data:
  kila-redis-data:

