services:
  postgres:
    image: postgres:16
    container_name: kila-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kilasifen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - kila-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kilasifen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: kila-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: kilasifen:local
    container_name: kila-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KILA_SIFEN_DATABASE_URL: ${KILA_SIFEN_DATABASE_URL}
      KILA_SIFEN_REDIS_URL: ${KILA_SIFEN_REDIS_URL}
      KILA_SIFEN_API_KEYS: ${KILA_SIFEN_API_KEYS}
      KILA_SIFEN_ENCRYPTION_KEY: ${KILA_SIFEN_ENCRYPTION_KEY}
      KILA_SIFEN_SIFEN_ENVIRONMENT: ${KILA_SIFEN_SIFEN_ENVIRONMENT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn kilasifen.api.app:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  worker:
    image: kilasifen:local
    container_name: kila-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KILA_SIFEN_DATABASE_URL: ${KILA_SIFEN_DATABASE_URL}
      KILA_SIFEN_REDIS_URL: ${KILA_SIFEN_REDIS_URL}
      KILA_SIFEN_ENCRYPTION_KEY: ${KILA_SIFEN_ENCRYPTION_KEY}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: rq worker documents webhooks -u ${KILA_SIFEN_REDIS_URL}

  migrate:
    image: kilasifen:local
    restart: "no"
    env_file:
      - .env
    environment:
      KILA_SIFEN_DATABASE_URL: ${KILA_SIFEN_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head

volumes:
  kila-postgres-data:

