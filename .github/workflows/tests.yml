name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

jobs:
  engine-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.19
          uv sync --frozen --extra sign --extra transmissao --extra test

      - name: Lint engine package
        run: |
          uv run ruff check kilasifen/engine/ --select F

      - name: Run engine regressions
        run: |
          uv run pytest tests/test_*.py -v --tb=short

  platform-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9
        env:
          POSTGRES_DB: kilasifen
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kilasifen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KILA_SIFEN_ENVIRONMENT: test
      KILA_SIFEN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kilasifen
      KILA_SIFEN_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kilasifen
      KILA_SIFEN_REDIS_URL: redis://localhost:6379/0
      KILA_SIFEN_API_KEYS: '["ci-platform-admin-key"]'
      KILA_SIFEN_ENCRYPTION_KEY: 4fV1_r04jQs6C1UNq9qS4RuCs1oQcWzER8GqW04A1lE=
      KILA_SIFEN_SIFEN_ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.19
          uv sync --frozen --extra sign --extra transmissao --extra test

      - name: Lint platform package
        run: |
          uv run ruff check kilasifen --select F

      - name: Run platform tests
        run: |
          uv run pytest tests/api tests/application tests/infrastructure -v --tb=short

      - name: Migration smoke check
        run: |
          uv run alembic upgrade head
          uv run alembic current --check-heads

      - name: App start smoke check
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from kilasifen.api.app import create_app

          client = TestClient(create_app())
          assert client.get("/v1/health").status_code == 200
          assert client.get("/v1/ready").status_code == 200
          print("platform app smoke ok")
          PY

  build-artifacts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install uv==0.11.19 twine
          uv build
          python -m twine check --strict dist/*

      - name: Install built wheel
        run: |
          python -m pip install dist/*.whl

      - name: Smoke test top-level public API
        run: |
          python - <<'PY'
          from kilasifen.engine import (
              ENDPOINTS,
              PRODUCCION,
              TEST,
              ConsultaSIFEN,
              TransmissaoDE,
              TransmissaoEvento,
              __all__,
              __version__,
              get_endpoint,
              sign_xml,
          )

          assert __version__
          assert callable(sign_xml)
          assert PRODUCCION == 1
          assert TEST == 2
          assert isinstance(ENDPOINTS, dict)
          assert callable(get_endpoint)
          assert TransmissaoDE.__name__ == "TransmissaoDE"
          assert ConsultaSIFEN.__name__ == "ConsultaSIFEN"
          assert TransmissaoEvento.__name__ == "TransmissaoEvento"
          expected = {
              "__version__",
              "sign_xml",
              "PRODUCCION",
              "TEST",
              "ENDPOINTS",
              "get_endpoint",
              "TransmissaoDE",
              "ConsultaSIFEN",
              "TransmissaoEvento",
          }
          assert set(__all__) == expected
          print("public api smoke ok")
          PY

  docs-site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: |
          python -m pip install uv==0.11.19
          uv sync --frozen --extra platform

      - name: Check committed OpenAPI contract
        run: uv run python scripts/export_openapi.py --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install docs dependencies
        working-directory: apps/docs
        run: pnpm install --frozen-lockfile

      - name: Validate docs site
        working-directory: apps/docs
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build

  typescript-sdk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      - name: Install SDK dependencies
        working-directory: sdks/typescript
        run: pnpm install --frozen-lockfile

      - name: Validate SDK
        working-directory: sdks/typescript
        run: |
          pnpm lint
          pnpm test
          pnpm build
          pnpm pack --dry-run

  check-schemas:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.19
          uv sync --frozen --extra test

      - name: Check for schema updates
        env:
          CHECK_SCHEMA_UPDATES: "1"
        run: |
          uv run pytest tests/test_schema_versions.py::TestSchemaUpdates -v

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag kilasifen:${{ github.sha }} .

