name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

jobs:
  engine-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sign,transmissao,test]"
          pip install ruff

      - name: Lint engine package
        run: |
          python -m ruff check pysifen/ --select F

      - name: Run engine regressions
        run: |
          pytest tests/test_*.py -v --tb=short

  platform-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sign,transmissao,test]"
          pip install ruff

      - name: Lint platform package
        run: |
          python -m ruff check kilasifen/ --select F

      - name: Run platform tests
        run: |
          pytest tests/api tests/application tests/infrastructure -v --tb=short

      - name: Migration smoke check
        env:
          KILA_SIFEN_DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          alembic upgrade head

      - name: App start smoke check
        env:
          KILA_SIFEN_API_KEYS: '["ci-key"]'
          KILA_SIFEN_DATABASE_URL: sqlite:///./ci-app.db
          KILA_SIFEN_ENCRYPTION_KEY: 4fV1_r04jQs6C1UNq9qS4RuCs1oQcWzER8GqW04A1lE=
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from kilasifen.api.app import create_app

          client = TestClient(create_app())
          assert client.get("/v1/health").status_code == 200
          assert client.get("/v1/ready").status_code == 200
          print("platform app smoke ok")
          PY

  build-artifacts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install built wheel
        run: |
          python -m pip install dist/*.whl

      - name: Smoke test top-level public API
        run: |
          python - <<'PY'
          from pysifen import (
              ENDPOINTS,
              PRODUCCION,
              TEST,
              ConsultaSIFEN,
              TransmissaoDE,
              TransmissaoEvento,
              __all__,
              __version__,
              get_endpoint,
              sign_xml,
          )

          assert __version__
          assert callable(sign_xml)
          assert PRODUCCION == 1
          assert TEST == 2
          assert isinstance(ENDPOINTS, dict)
          assert callable(get_endpoint)
          assert TransmissaoDE.__name__ == "TransmissaoDE"
          assert ConsultaSIFEN.__name__ == "ConsultaSIFEN"
          assert TransmissaoEvento.__name__ == "TransmissaoEvento"
          expected = {
              "__version__",
              "sign_xml",
              "PRODUCCION",
              "TEST",
              "ENDPOINTS",
              "get_endpoint",
              "TransmissaoDE",
              "ConsultaSIFEN",
              "TransmissaoEvento",
          }
          assert set(__all__) == expected
          print("public api smoke ok")
          PY

  check-schemas:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Check for schema updates
        env:
          CHECK_SCHEMA_UPDATES: "1"
        run: |
          pytest tests/test_schema_versions.py::TestSchemaUpdates -v

