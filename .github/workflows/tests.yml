name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1"  # Toda segunda às 6h UTC

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sign,transmissao,test]"

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check pysifen/ tests/

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  build-artifacts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install built wheel
        run: |
          python -m pip install dist/*.whl

      - name: Smoke test top-level public API
        run: |
          python - <<'PY'
          from pysifen import (
              ENDPOINTS,
              PRODUCCION,
              TEST,
              ConsultaSIFEN,
              TransmissaoDE,
              TransmissaoEvento,
              __all__,
              __version__,
              get_endpoint,
              sign_xml,
          )

          assert __version__
          assert callable(sign_xml)
          assert PRODUCCION == 1
          assert TEST == 2
          assert isinstance(ENDPOINTS, dict)
          assert callable(get_endpoint)
          assert TransmissaoDE.__name__ == "TransmissaoDE"
          assert ConsultaSIFEN.__name__ == "ConsultaSIFEN"
          assert TransmissaoEvento.__name__ == "TransmissaoEvento"
          expected = {
              "__version__",
              "sign_xml",
              "PRODUCCION",
              "TEST",
              "ENDPOINTS",
              "get_endpoint",
              "TransmissaoDE",
              "ConsultaSIFEN",
              "TransmissaoEvento",
          }
          assert set(__all__) == expected
          print("public api smoke ok")
          PY

  check-schemas:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Check for schema updates
        env:
          CHECK_SCHEMA_UPDATES: "1"
        run: |
          pytest tests/test_schema_versions.py::TestSchemaUpdates -v
